services:
  - type: web
    name: shattered-backboard-nba
    runtime: python
    rootDir: server
    # Temporary accounting works on Free; no persistent disk or paid service.
    plan: free
    buildCommand: pip install -r requirements.txt && python -m unittest discover -s . -p test_chat_api.py -v
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: OPENAI_API_KEY
        sync: false
      - key: NBA_CHAT_TOKEN
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: NBA_CHAT_DAILY_USD
        value: "2"
      - key: NBA_SEARCH_COST_USD
        value: "0.005"
